{% extends "layout.html" %}

{% block title %}
    Register
{% endblock %}

{% block main %}
    <!--<form action="/register" method="post">-->
        <form action="{{ url_for('register')}}" method="post"></form>
        <!--<div class="mb-3">-->
        <div class="form-group">
            <!--<input autocomplete="off" autofocus class="form-control mx-auto w-auto" id="username" name="username" placeholder="Username" type="text">
            -->
            <input autocomplete="off" autofocus class="form-control" id="username" name="username" placeholder="Username" type="text">
        </div>
        <div class="mb-3">
            <input class="form-control" id="password" name="password" placeholder="Password" type="password">
        </div>
        <div class="mb-3">
            <input class="form-control" id="confirmation" name="confirmation" placeholder="Verify Password" type="password">
        </div>

        <button class="btn btn-primary" type="submit">Register</button>
    </form>
{% endblock %}
