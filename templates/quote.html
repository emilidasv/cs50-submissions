{% extends "layout.html" %}

{% block title %}
    Quote
{% endblock %}

{% block main %}
    <h1> Get a stock quote</h1>
    <form action="/quote" method="post">
        <label for ="symbol" >Symbol </label>
        <input name="symbol" id = "symbol" placeholder="Symbol" type="text">
        <button type="submit">Get a quote</button>
    </form>
    {% if stock_quote %}
    <h3>{{ stock_quote['name'] }} ({{stock_quote['symbol']}}) Price:{{stock_quote['price']}}</h3>
    {% endif %}
{% endblock %}
